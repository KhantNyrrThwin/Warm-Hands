<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar sign gallery</title>
<style>
  body { margin: 0; background: #fffaf3; color: #3a2e24; font: 14px system-ui, sans-serif }
  header { padding: 12px 16px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap }
  h1 { font-size: 18px; margin: 0 }
  nav a { margin-right: 10px; color: #a0521d }
  h2 { font-size: 15px; margin: 16px 16px 4px }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; padding: 0 16px 16px }
  figure { margin: 0; background: #fff3e3; border-radius: 10px; overflow: hidden; cursor: pointer }
  canvas { display: block; width: 100%; aspect-ratio: 1 }
  figcaption { padding: 6px 8px; font-size: 13px; line-height: 1.3 }
  figcaption small { color: #8a7766 }
</style>
</head>
<body>
<header>
  <h1>Avatar sign gallery</h1>
  <nav><a href="?show=all">All</a><a href="?show=new">30 spreadsheet signs</a><a href="?show=old">Earlier signs</a></nav>
  <span>Click a tile to replay it from the start.</span>
</header>
<main id="main"></main>
<script type="module" src="./gallery.ts"></script>
</body>
</html>
